name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: |
          pytest -q
      - name: Build image
        run: |
          docker compose build
